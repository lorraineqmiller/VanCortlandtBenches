services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: benches
      POSTGRES_USER: benches
      POSTGRES_PASSWORD: benches
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benches -d benches"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: benches
      POSTGRES_USER: benches
      POSTGRES_PASSWORD: benches
      DJANGO_DEBUG: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
